name: frontend-image

# Build the frontend image in CI and let Coolify only PULL it.
# Same pattern as the backend (deploy/docker-compose.coolify.ghcr.yml): the host
# never sees repository credentials and never spends CPU on a build.
#
# Required repository secrets/vars: none beyond the default GITHUB_TOKEN.
# Image: ghcr.io/<owner>/phantix-frontend:{latest,sha-<short>}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/phantix-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fail fast on type errors before paying for a Docker build.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck:all

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_APPS="${BUILD_APPS}" \
            --build-arg BUILD_STANDALONE="${BUILD_STANDALONE}" \
            --build-arg VITE_BLOG_API_URL="${VITE_BLOG_API_URL}" \
            --build-arg VITE_FIREBASE_API_KEY="${VITE_FIREBASE_API_KEY}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${VITE_FIREBASE_AUTH_DOMAIN}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${VITE_FIREBASE_PROJECT_ID}" \
            -t "${IMAGE}:sha-${GITHUB_SHA::7}" \
            -t "${IMAGE}:latest" .
        env:
          BUILD_APPS: core attack defend code blog
          BUILD_STANDALONE: staff platform landing
          # PUBLIC values baked into the bundle (never secrets).
          VITE_BLOG_API_URL: ${{ vars.VITE_BLOG_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}

      # Smoke: the config must parse and every host must answer.
      - name: Smoke test all five hosts
        run: |
          docker run -d --name fe -p 8080:80 \
            -e API_PROXY_TARGET=http://127.0.0.1:9 \
            -e FE_HOST_APP=app.test \
            -e FE_HOST_ATTACK=attack.test \
            -e FE_HOST_DEFEND=defend.test \
            -e FE_HOST_CODE=code.test \
            -e FE_HOST_BLOG=blog.test \
            -e FE_HOST_STAFF=staff.test \
            -e FE_HOST_PLATFORM=platform.test \
            -e "FE_HOST_LANDING=landing.test www.landing.test" \
            "${IMAGE}:sha-${GITHUB_SHA::7}"
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break || sleep 1
          done
          for host in app.test attack.test defend.test code.test blog.test \
                      staff.test platform.test landing.test www.landing.test; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: ${host}" http://127.0.0.1:8080/)
            echo "${host} -> ${code}"
            test "${code}" = "200" || { docker logs fe; exit 1; }
          done
          # Unknown Host must not be served an app.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.test' http://127.0.0.1:8080/)" = "404"
          docker rm -f fe

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          docker push "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker push "${IMAGE}:latest"
