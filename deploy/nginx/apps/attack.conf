# attack: single-app container (nginx), built by deploy/Dockerfile.app.
# /api and /api/v1 are reverse-proxied to ${API_PROXY_TARGET} (required at run
# time), which keeps the API session cookie first-party on this app's hostname.
# Client protocol as seen by the edge (Traefik terminates TLS, so $scheme is
# http inside the container; prefer the header the proxy set).
map $http_x_forwarded_proto $phantix_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $uri $app_cache_control {
    default     "public, max-age=0, must-revalidate";
    ~^/static/  "public, max-age=31536000, immutable";
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/fonts/   "public, max-age=31536000, immutable";
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html/dist;
    index index.html;

    include /etc/nginx/snippets/gzip.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $app_cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://www.google.com; connect-src 'self' https://cloudflareinsights.com https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    client_max_body_size 200m;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass ${API_PROXY_TARGET};
    }

    location /api/v1/ {
        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass ${API_PROXY_TARGET};
    }

    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
    }
}
