# `/api/v1/*` → the backend, same-origin from the browser's point of view.
# This is what replaces the Vercel rewrite, and what keeps the API's session
# cookie first-party on the app's hostname.
#
# The upstream itself is set by the proxy_pass line in each server block:
# block: only /etc/nginx/templates is envsubst'd, so the placeholder must live in
# the template, not in this snippet. No URI part in proxy_pass means nginx
# forwards the original request URI unchanged (so do not add a trailing slash).

proxy_http_version 1.1;
proxy_set_header Host $proxy_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $phantix_proto;
proxy_set_header X-Forwarded-Host $host;
# Keep upgrades alive: -$connection_upgrade is "upgrade" only for WS requests.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# TLS to the backend (Traefik/ACME there) needs SNI.
proxy_ssl_server_name on;

# Streamed/long-running responses (scan progress, AGI streams): never buffer.
proxy_buffering off;
proxy_request_buffering off;
proxy_read_timeout 300s;
proxy_send_timeout 300s;
proxy_connect_timeout 15s;

