# Compression. Vercel did this at the edge; a self-hosted box must do it itself.
# Brotli needs a third-party module — gzip is enough for JS/CSS/JSON payloads.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/manifest+json
    application/wasm
    image/svg+xml
    font/woff
    font/woff2;
