# Headers every app response carries. Applied at `server` level with
# `add_header … always` so error responses are covered too.
#
# NOTE: nginx drops all inherited add_header directives in a `location` that
# declares its own. That is why Cache-Control is set once at server level from a
# `map` ($phantix_cache_control) instead of per-location — it keeps these headers
# on static assets.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), display-capture=()" always;
