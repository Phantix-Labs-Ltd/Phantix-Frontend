<svg viewBox="0 0 876.0 688.0" width="876" height="688" data-diagram="Platform: Install the SecureGraph Connector process flow" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:0 auto">
  <title>Platform: Install the SecureGraph Connector process flow</title>
  <rect x="0" y="0" width="876" height="688" rx="14" fill="#0A0A0A"/>
  <rect x="0.75" y="0.75" width="874.5" height="686.5" rx="13" fill="none" stroke="#27272A" stroke-width="1.5"/>
<defs><marker id="flow-arrow-14c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8B54D"/></marker></defs>
<g><rect x="258.0" y="40" width="360" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="72.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Add connector and name it</tspan></text><line x1="438.0" y1="96" x2="438.0" y2="130" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-14c)"/><rect x="258.0" y="132" width="360" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="156.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Enter the database host:port</tspan><tspan x="438.0" dy="17">(fills SG_ALLOWED_TARGETS)</tspan></text><line x1="438.0" y1="188" x2="438.0" y2="222" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-14c)"/><rect x="258.0" y="224" width="360" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="248.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Copy the Docker, Compose or</tspan><tspan x="438.0" dy="17">Kubernetes command with the token</tspan></text><line x1="438.0" y1="280" x2="438.0" y2="314" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-14c)"/><rect x="258.0" y="316" width="360" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="348.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Run it next to the database</tspan></text><line x1="438.0" y1="372" x2="438.0" y2="406" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-14c)"/><rect x="258.0" y="408" width="360" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="432.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Connector enrolls and connects out</tspan><tspan x="438.0" dy="17">over TLS on port 443</tspan></text><line x1="438.0" y1="464" x2="438.0" y2="498" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-14c)"/><rect x="258.0" y="500" width="360" height="56" rx="9" fill="#241E10" stroke="#E8B54D" stroke-width="1.3"/><text x="438.0" y="532.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#F3CD7E"><tspan x="438.0" dy="0">Online</tspan></text><line x1="438.0" y1="556" x2="438.0" y2="590" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-14c)"/><rect x="258.0" y="592" width="360" height="56" rx="9" fill="#241E10" stroke="#E8B54D" stroke-width="1.3"/><text x="438.0" y="616.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#F3CD7E"><tspan x="438.0" dy="0">Add the database through the connector,</tspan><tspan x="438.0" dy="17">then test and prepare it</tspan></text><text x="688.0" y="440" text-anchor="middle" font-size="11" font-family="'Geist Variable',system-ui,sans-serif" fill="#A1A1AA">No inbound port</text></g>
</svg>
