<svg viewBox="0 0 876.0 846.0" width="876" height="846" data-diagram="Command Centre: Run a VAPT campaign process flow" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:0 auto">
  <title>Command Centre: Run a VAPT campaign process flow</title>
  <rect x="0" y="0" width="876" height="846" rx="14" fill="#0A0A0A"/>
  <rect x="0.75" y="0.75" width="874.5" height="844.5" rx="13" fill="none" stroke="#27272A" stroke-width="1.5"/>
<defs><marker id="flow-arrow-cc06c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8B54D"/></marker></defs>
<g><rect x="288.0" y="40" width="300" height="56" rx="9" fill="#241E10" stroke="#E8B54D" stroke-width="1.3"/><text x="438.0" y="72.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#F3CD7E"><tspan x="438.0" dy="0">Has a campaign started yet?</tspan></text><line x1="378.0" y1="96" x2="240.0" y2="138" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><line x1="498.0" y1="96" x2="636.0" y2="138" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><text x="190.0" y="118" text-anchor="middle" font-size="11" font-family="'Geist Variable',system-ui,sans-serif" fill="#A1A1AA">No: Run your first VAPT</text><text x="696.0" y="118" text-anchor="middle" font-size="11" font-family="'Geist Variable',system-ui,sans-serif" fill="#A1A1AA">Yes: New campaign</text><rect x="75.0" y="140" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="240.0" y="172.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="240.0" dy="0">Add your first asset</tspan></text><line x1="240.0" y1="196" x2="240.0" y2="238" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><rect x="75.0" y="240" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="240.0" y="264.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="240.0" dy="0">Verify you own the domain</tspan><tspan x="240.0" dy="17">(on the Platform)</tspan></text><line x1="240.0" y1="296" x2="240.0" y2="338" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><rect x="75.0" y="340" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="240.0" y="364.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="240.0" dy="0">Review the plan, then</tspan><tspan x="240.0" dy="17">Create draft campaign</tspan></text><rect x="471.0" y="140" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="636.0" y="164.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="636.0" dy="0">Name, type, procedure,</tspan><tspan x="636.0" dy="17">asset scope</tspan></text><line x1="636.0" y1="196" x2="636.0" y2="238" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><rect x="471.0" y="240" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="636.0" y="264.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="636.0" dy="0">Create the draft campaign</tspan><tspan x="636.0" dy="17">(operate mode)</tspan></text><line x1="240.0" y1="396" x2="398.0" y2="448" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><line x1="636.0" y1="296" x2="478.0" y2="448" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><rect x="258.0" y="450" width="360" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="474.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Start: an authorizer approves</tspan><tspan x="438.0" dy="17">when approval is required</tspan></text><line x1="438.0" y1="506" x2="438.0" y2="548" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><rect x="258.0" y="550" width="360" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="574.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Phases progress: recon,</tspan><tspan x="438.0" dy="17">scan, correlate</tspan></text><line x1="438.0" y1="606" x2="438.0" y2="648" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><rect x="258.0" y="650" width="360" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="682.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Review the correlated findings</tspan></text><line x1="438.0" y1="706" x2="438.0" y2="748" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-cc06c)"/><rect x="258.0" y="750" width="360" height="56" rx="9" fill="#241E10" stroke="#E8B54D" stroke-width="1.3"/><text x="438.0" y="782.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#F3CD7E"><tspan x="438.0" dy="0">Generate the client report package</tspan></text></g>
</svg>
