<svg viewBox="0 0 876.0 846.0" width="876" height="846" data-diagram="Platform: Connect a security database process flow" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:100%;height:auto;display:block;margin:0 auto">
  <title>Platform: Connect a security database process flow</title>
