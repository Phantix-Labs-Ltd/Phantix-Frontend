  <rect x="0.75" y="0.75" width="874.5" height="844.5" rx="13" fill="none" stroke="#27272A" stroke-width="1.5"/>
<defs><marker id="flow-arrow-06c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E8B54D"/></marker></defs>
<g><rect x="288.0" y="40" width="300" height="56" rx="9" fill="#241E10" stroke="#E8B54D" stroke-width="1.3"/><text x="438.0" y="64.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#F3CD7E"><tspan x="438.0" dy="0">Connect database:</tspan><tspan x="438.0" dy="17">where is your database?</tspan></text><line x1="378.0" y1="96" x2="240.0" y2="138" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><line x1="498.0" y1="96" x2="636.0" y2="138" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><text x="190.0" y="118" text-anchor="middle" font-size="11" font-family="'Geist Variable',system-ui,sans-serif" fill="#A1A1AA">Publicly hosted</text><text x="696.0" y="118" text-anchor="middle" font-size="11" font-family="'Geist Variable',system-ui,sans-serif" fill="#A1A1AA">Private network</text><rect x="75.0" y="140" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="240.0" y="172.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="240.0" dy="0">Choose the provider</tspan></text><line x1="240.0" y1="196" x2="240.0" y2="238" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><rect x="75.0" y="240" width="330" height="56" rx="9" fill="#241E10" stroke="#E8B54D" stroke-width="1.3"/><text x="240.0" y="264.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#F3CD7E"><tspan x="240.0" dy="0">Allowlist every SecureGraph address</tspan><tspan x="240.0" dy="17">and tick each one (required)</tspan></text><line x1="240.0" y1="296" x2="240.0" y2="338" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><rect x="75.0" y="340" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="240.0" y="364.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="240.0" dy="0">Paste the connection URL</tspan><tspan x="240.0" dy="17">and click Connect</tspan></text><rect x="471.0" y="140" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="636.0" y="172.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="636.0" dy="0">Create a connector</tspan></text><line x1="636.0" y1="196" x2="636.0" y2="238" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><rect x="471.0" y="240" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="636.0" y="272.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="636.0" dy="0">Install it next to the database</tspan></text><line x1="636.0" y1="296" x2="636.0" y2="338" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><rect x="471.0" y="340" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="636.0" y="372.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="636.0" dy="0">Wait for Online</tspan></text><line x1="636.0" y1="396" x2="636.0" y2="438" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><rect x="471.0" y="440" width="330" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="636.0" y="464.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="636.0" dy="0">Add the database as</tspan><tspan x="636.0" dy="17">the connector sees it</tspan></text><line x1="240.0" y1="396" x2="398.0" y2="548" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><line x1="636.0" y1="496" x2="478.0" y2="548" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><rect x="278.0" y="550" width="320" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="582.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Test the connection</tspan></text><line x1="438.0" y1="606" x2="438.0" y2="648" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><rect x="278.0" y="650" width="320" height="56" rx="9" fill="#151517" stroke="#3F3F46" stroke-width="1.3"/><text x="438.0" y="674.0" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#E4E4E7"><tspan x="438.0" dy="0">Prepare the security database</tspan><tspan x="438.0" dy="17">(SecureGraph schema only)</tspan></text><line x1="438.0" y1="706" x2="438.0" y2="748" stroke="#E8B54D" stroke-width="1.5" marker-end="url(#flow-arrow-06c)"/><rect x="278.0" y="750" width="320" height="56" rx="9" fill="#241E10" stroke="#E8B54D" stroke-width="1.3"/><text x="438.0" y="782.5" text-anchor="middle" font-size="12.5" font-family="'Geist Variable',system-ui,sans-serif" fill="#F3CD7E"><tspan x="438.0" dy="0">Done: the gate reads ready</tspan></text></g>
</svg>
