<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/><stop offset="100%" stop-color="#2A2A2E"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8B54D"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#0A0A0A"/>
  <text x="450.0" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">Assets Come in Families</text>
  <text x="450.0" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">A domain owns its subdomains. Ownership should travel with the tree.</text>
  <rect x="370" y="100" width="160" height="56" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="2"/>
  <text x="450.0" y="132.0" text-anchor="middle" font-size="13" fill="#F3CD7E">example.com</text>
  <line x1="450" y1="156" x2="450" y2="178" stroke="#E8B54D" stroke-width="1.6" marker-end="url(#arrowGold)"/>
  <line x1="180" y1="178" x2="720" y2="178" stroke="#E8B54D" stroke-width="1.4"/>
  <line x1="180.0" y1="178" x2="180.0" y2="110" stroke="#A1A1AA" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="340.0" y1="178" x2="340.0" y2="210" stroke="#A1A1AA" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="500.0" y1="178" x2="500.0" y2="310" stroke="#A1A1AA" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="660.0" y1="178" x2="660.0" y2="410" stroke="#A1A1AA" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="110.0" y="110" width="140" height="52" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5"/>
  <text x="180.0" y="132.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E4E4E7">app.example.com</text>
  <text x="180.0" y="151.0" text-anchor="middle" font-size="11" fill="#A1A1AA">in scope</text>
  <rect x="270.0" y="210" width="140" height="52" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5"/>
  <text x="340.0" y="232.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E4E4E7">www.example.com</text>
  <text x="340.0" y="251.0" text-anchor="middle" font-size="11" fill="#A1A1AA">in scope</text>
  <rect x="430.0" y="310" width="140" height="52" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5"/>
  <text x="500.0" y="332.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E4E4E7">api.example.com</text>
  <text x="500.0" y="351.0" text-anchor="middle" font-size="11" fill="#A1A1AA">in scope</text>
  <rect x="590.0" y="410" width="140" height="52" rx="8" fill="#2A1017" stroke="#F43F5E" stroke-width="2"/>
  <text x="660.0" y="432.0" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F43F5E">staging.example.com</text>
  <text x="660.0" y="451.0" text-anchor="middle" font-size="11" fill="#A1A1AA">no owner</text>
  <text x="60" y="430" text-anchor="start" font-size="12.5" font-weight="400" fill="#A1A1AA">One parent, one owner. Anything unclaimed is either retired or brought into scope.</text>
</svg>
