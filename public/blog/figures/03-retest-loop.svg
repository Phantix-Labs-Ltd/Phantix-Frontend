<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/><stop offset="100%" stop-color="#2A2A2E"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8B54D"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#0A0A0A"/>
  <text x="450.0" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">The Loop That Makes a Fix Hold</text>
  <text x="450.0" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">A ticket closes on trust. A fix closes on proof.</text>
  <circle cx="450" cy="240" r="120" fill="none" stroke="#E8B54D" stroke-width="1.4" stroke-dasharray="6 8"/>
  <rect x="365" y="92" width="170" height="56" rx="8" fill="#241E10" stroke="#E8B54D" stroke-width="1.8"/>
  <text x="450.0" y="116.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F3CD7E">Fix</text>
  <text x="450.0" y="135.0" text-anchor="middle" font-size="11" fill="#A1A1AA">Change the code</text>
  <rect x="535" y="212" width="170" height="56" rx="8" fill="#241E10" stroke="#E8B54D" stroke-width="1.8"/>
  <text x="620.0" y="236.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F3CD7E">Retest</text>
  <text x="620.0" y="255.0" text-anchor="middle" font-size="11" fill="#A1A1AA">Replay the original proof</text>
  <rect x="365" y="332" width="170" height="56" rx="8" fill="#241E10" stroke="#E8B54D" stroke-width="1.8"/>
  <text x="450.0" y="356.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F3CD7E">Regression test</text>
  <text x="450.0" y="375.0" text-anchor="middle" font-size="11" fill="#A1A1AA">Keep the check</text>
  <rect x="195" y="212" width="170" height="56" rx="8" fill="#241E10" stroke="#E8B54D" stroke-width="1.8"/>
  <text x="280.0" y="236.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#F3CD7E">Held</text>
  <text x="280.0" y="255.0" text-anchor="middle" font-size="11" fill="#A1A1AA">Proven, not hoped</text>
  <text x="450" y="236" text-anchor="middle" font-size="13" font-weight="400" fill="#A1A1AA">Same input</text>
  <text x="450" y="258" text-anchor="middle" font-size="13" font-weight="400" fill="#A1A1AA">Same result</text>
</svg>
