<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Six controls that protect an organization's database</title>
  <desc id="d">Private connection, encryption, least privilege, a dedicated schema, admin-only changes, and audit with fast revocation.</desc>
  <rect width="900" height="400" fill="#0A0A0A"/>
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">Six Controls Between a Platform and Your Data</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">Private connectivity closes the door; these decide what happens inside</text>

  <g>
    <rect x="40" y="96" width="260" height="120" rx="10" fill="#241E10" stroke="#E8B54D" stroke-width="1.5"/>
    <circle cx="68" cy="126" r="13" fill="none" stroke="#E8B54D" stroke-width="1.5"/>
    <text x="68" y="130.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F3CD7E">1</text>
    <text x="92" y="131" font-size="14" font-weight="700" fill="#F3CD7E">Private connection</text>
    <text x="60" y="170" font-size="12" fill="#A1A1AA">No inbound port is opened.</text>
    <text x="60" y="189" font-size="12" fill="#A1A1AA">Traffic starts inside your network.</text>
  </g>
  <g>
    <rect x="320" y="96" width="260" height="120" rx="10" fill="#111113" stroke="#3F3F46"/>
    <circle cx="348" cy="126" r="13" fill="none" stroke="#E8B54D" stroke-width="1.5"/>
    <text x="348" y="130.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F3CD7E">2</text>
    <text x="372" y="131" font-size="14" font-weight="700" fill="#E4E4E7">Encryption</text>
    <text x="340" y="170" font-size="12" fill="#A1A1AA">TLS required on every connection.</text>
    <text x="340" y="189" font-size="12" fill="#A1A1AA">Credentials encrypted at rest.</text>
  </g>
  <g>
    <rect x="600" y="96" width="260" height="120" rx="10" fill="#111113" stroke="#3F3F46"/>
    <circle cx="628" cy="126" r="13" fill="none" stroke="#E8B54D" stroke-width="1.5"/>
    <text x="628" y="130.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F3CD7E">3</text>
    <text x="652" y="131" font-size="14" font-weight="700" fill="#E4E4E7">Least privilege</text>
    <text x="620" y="170" font-size="12" fill="#A1A1AA">One database user that owns only</text>
    <text x="620" y="189" font-size="12" fill="#A1A1AA">the security schema.</text>
  </g>
  <g>
    <rect x="40" y="236" width="260" height="120" rx="10" fill="#111113" stroke="#3F3F46"/>
    <circle cx="68" cy="266" r="13" fill="none" stroke="#E8B54D" stroke-width="1.5"/>
    <text x="68" y="270.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F3CD7E">4</text>
    <text x="92" y="271" font-size="14" font-weight="700" fill="#E4E4E7">Dedicated schema</text>
    <text x="60" y="310" font-size="12" fill="#A1A1AA">Findings stay apart from your</text>
    <text x="60" y="329" font-size="12" fill="#A1A1AA">application tables.</text>
  </g>
  <g>
    <rect x="320" y="236" width="260" height="120" rx="10" fill="#111113" stroke="#3F3F46"/>
    <circle cx="348" cy="266" r="13" fill="none" stroke="#E8B54D" stroke-width="1.5"/>
    <text x="348" y="270.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F3CD7E">5</text>
    <text x="372" y="271" font-size="14" font-weight="700" fill="#E4E4E7">Admin-only changes</text>
    <text x="340" y="310" font-size="12" fill="#A1A1AA">Only your admin can add or change</text>
    <text x="340" y="329" font-size="12" fill="#A1A1AA">a connection.</text>
  </g>
  <g>
    <rect x="600" y="236" width="260" height="120" rx="10" fill="#111113" stroke="#3F3F46"/>
    <circle cx="628" cy="266" r="13" fill="none" stroke="#E8B54D" stroke-width="1.5"/>
    <text x="628" y="270.5" text-anchor="middle" font-size="12" font-weight="700" fill="#F3CD7E">6</text>
    <text x="652" y="271" font-size="14" font-weight="700" fill="#E4E4E7">Audit and revocation</text>
    <text x="620" y="310" font-size="12" fill="#A1A1AA">Every change is logged. Revoke</text>
    <text x="620" y="329" font-size="12" fill="#A1A1AA">access in one step.</text>
  </g>
  <text x="450" y="384" text-anchor="middle" font-size="12" fill="#A1A1AA">Ask any vendor for all six before you connect it to a database.</text>
</svg>
