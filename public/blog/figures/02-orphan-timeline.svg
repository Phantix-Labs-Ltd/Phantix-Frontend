<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/><stop offset="100%" stop-color="#2A2A2E"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8B54D"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#0A0A0A"/>
  <text x="450.0" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">How an Asset Falls Out of Inventory</text>
  <text x="450.0" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">A reasonable launch, and two years of quiet drift</text>
  <rect x="70" y="180" width="180" height="96" rx="8" fill="url(#boxGrad)" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="160.0" y="224.0" text-anchor="middle" font-size="13" font-weight="600" fill="#E4E4E7">Launch</text>
  <text x="160.0" y="243.0" text-anchor="middle" font-size="11" fill="#A1A1AA">A campaign microsite goes live</text>
  <text x="160" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#E8B54D">2024</text>
  <line x1="250" y1="228" x2="280" y2="228" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="280" y="180" width="180" height="96" rx="8" fill="url(#boxGrad)" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="370.0" y="224.0" text-anchor="middle" font-size="13" font-weight="600" fill="#E4E4E7">Campaign ends</text>
  <text x="370.0" y="243.0" text-anchor="middle" font-size="11" fill="#A1A1AA">The site stays up</text>
  <text x="370" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#E8B54D">2024</text>
  <line x1="460" y1="228" x2="490" y2="228" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="490" y="180" width="180" height="96" rx="8" fill="url(#boxGrad)" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="580.0" y="224.0" text-anchor="middle" font-size="13" font-weight="600" fill="#E4E4E7">Owner leaves</text>
  <text x="580.0" y="243.0" text-anchor="middle" font-size="11" fill="#A1A1AA">No one inherits it</text>
  <text x="580" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#E8B54D">2025</text>
  <line x1="670" y1="228" x2="700" y2="228" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="700" y="180" width="180" height="96" rx="8" fill="url(#boxGrad)" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="790.0" y="224.0" text-anchor="middle" font-size="13" font-weight="600" fill="#E4E4E7">Found today</text>
  <text x="790.0" y="243.0" text-anchor="middle" font-size="11" fill="#A1A1AA">Outside the inventory</text>
  <text x="790" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#E8B54D">2026</text>
  <line x1="70" y1="300" x2="830" y2="300" stroke="#3F3F46" stroke-width="1"/>
  <text x="70" y="348" text-anchor="start" font-size="13" font-weight="400" fill="#A1A1AA">Every step was reasonable. The estate still grew a blind spot.</text>
  <text x="70" y="372" text-anchor="start" font-size="13" font-weight="400" fill="#A1A1AA">An asset tree with one owner per branch makes that gap visible in seconds.</text>
</svg>
