<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/><stop offset="100%" stop-color="#2A2A2E"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8B54D"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#0A0A0A"/>
  <text x="450.0" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">What a Verified Finding Carries</text>
  <text x="450.0" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">The bundle an engineer needs to act without a meeting</text>
  <rect x="60" y="110" width="360" height="300" rx="8" fill="url(#boxGrad)" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="240.0" y="264.0" text-anchor="middle" font-size="12.5" fill="#E4E4E7"></text>
  <text x="88" y="150" text-anchor="start" font-size="14" font-weight="700" fill="#E8B54D">FINDING F-1042</text>
  <text x="88" y="190" text-anchor="start" font-size="12" font-weight="400" fill="#A1A1AA">Asset</text>
  <text x="220" y="190" text-anchor="start" font-size="12.5" font-weight="400" fill="#E4E4E7">payments.api.example.com</text>
  <text x="88" y="220" text-anchor="start" font-size="12" font-weight="400" fill="#A1A1AA">Path</text>
  <text x="220" y="220" text-anchor="start" font-size="12.5" font-weight="400" fill="#E4E4E7">POST /v1/refund</text>
  <text x="88" y="250" text-anchor="start" font-size="12" font-weight="400" fill="#A1A1AA">Input</text>
  <text x="220" y="250" text-anchor="start" font-size="12.5" font-weight="400" fill="#E4E4E7">amount = -1</text>
  <text x="88" y="280" text-anchor="start" font-size="12" font-weight="400" fill="#A1A1AA">Response</text>
  <text x="220" y="280" text-anchor="start" font-size="12.5" font-weight="400" fill="#E4E4E7">200 OK, balance increased</text>
  <text x="88" y="310" text-anchor="start" font-size="12" font-weight="400" fill="#A1A1AA">Evidence</text>
  <text x="220" y="310" text-anchor="start" font-size="12.5" font-weight="400" fill="#E4E4E7">request and response captured</text>
  <text x="88" y="340" text-anchor="start" font-size="12" font-weight="400" fill="#A1A1AA">Owner</text>
  <text x="220" y="340" text-anchor="start" font-size="12.5" font-weight="400" fill="#E4E4E7">payments team</text>
  <text x="88" y="370" text-anchor="start" font-size="12" font-weight="400" fill="#A1A1AA">Retest</text>
  <text x="220" y="370" text-anchor="start" font-size="12.5" font-weight="400" fill="#E4E4E7">proof replayed after the fix</text>
  <rect x="460" y="110" width="380" height="140" rx="8" fill="#241E10" stroke="#E8B54D" stroke-width="2"/>
  <text x="650.0" y="184.0" text-anchor="middle" font-size="14" fill="#F3CD7E">Verified</text>
  <text x="650" y="152" text-anchor="middle" font-size="11.5" font-weight="400" fill="#A1A1AA">Confirmed by an independent verifier</text>
  <rect x="460" y="270" width="380" height="140" rx="8" fill="url(#boxGrad)" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="650.0" y="344.0" text-anchor="middle" font-size="14" fill="#A1A1AA">Unverified</text>
  <text x="650" y="312" text-anchor="middle" font-size="11.5" font-weight="400" fill="#A1A1AA">Stays in the appendix, clearly labelled</text>
</svg>
