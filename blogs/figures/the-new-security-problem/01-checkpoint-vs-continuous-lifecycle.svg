<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">A Checkpoint and a Cycle</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">Security as a point-in-time gate, against how modern delivery actually runs</text>

  <text x="60" y="104" font-size="13" font-weight="700" fill="#A1A1AA">Security as a checkpoint</text>

  <rect x="60" y="120" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="134" y="155" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Build</text>

  <line x1="210" y1="148" x2="220" y2="148" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="224" y="120" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="298" y="155" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Test</text>

  <line x1="374" y1="148" x2="384" y2="148" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="388" y="120" width="148" height="56" rx="8" fill="#241E10" stroke="#E8B54D" stroke-width="2" filter="url(#shadow)"/>
  <text x="462" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#F3CD7E">Security assessment</text>

  <line x1="538" y1="148" x2="548" y2="148" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="552" y="120" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="626" y="155" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Fix</text>

  <line x1="702" y1="148" x2="712" y2="148" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="716" y="120" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="155" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Deploy</text>

  <text x="60" y="200" font-size="12" fill="#A1A1AA">A point in time: the report describes the application on the day it was tested.</text>

  <text x="60" y="244" font-size="13" font-weight="700" fill="#E8B54D">How modern delivery actually runs</text>

  <rect x="60" y="260" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="134" y="295" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Build</text>

  <line x1="210" y1="288" x2="220" y2="288" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="224" y="260" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="298" y="295" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Test</text>

  <line x1="374" y1="288" x2="384" y2="288" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="388" y="260" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="462" y="295" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Deploy</text>

  <line x1="538" y1="288" x2="548" y2="288" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="552" y="260" width="148" height="56" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="2" filter="url(#shadow)"/>
  <text x="626" y="295" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E8B54D">Change</text>

  <line x1="702" y1="288" x2="712" y2="288" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="716" y="260" width="148" height="56" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="790" y="295" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Deploy</text>

  <path d="M790 316 L790 344 L626 344 L626 320" fill="none" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="700" y="366" text-anchor="middle" font-size="11.5" fill="#A1A1AA">and the cycle continues</text>

  <rect x="60" y="386" width="780" height="80" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>
  <text x="80" y="416" font-size="13" font-weight="600" fill="#E4E4E7">Software changes continuously, so security needs to continuously validate those changes.</text>
  <text x="80" y="442" font-size="12" fill="#A1A1AA">The difference is more than a change in workflow. It is a change in mindset.</text>
</svg>
