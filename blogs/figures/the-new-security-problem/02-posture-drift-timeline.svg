<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">What a Point-in-Time Assessment Cannot See</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">The report stays true to the day it was written while the application keeps moving</text>

  <rect x="60" y="110" width="300" height="120" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="138" font-size="13" font-weight="700" fill="#E8B54D">January</text>
  <text x="80" y="164" font-size="12" fill="#E4E4E7">Penetration test run.</text>
  <text x="80" y="184" font-size="12" fill="#E4E4E7">Vulnerabilities fixed.</text>
  <text x="80" y="204" font-size="12" fill="#E4E4E7">Report produced.</text>

  <line x1="210" y1="230" x2="210" y2="262" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="540" y="110" width="300" height="160" rx="8" fill="#1F1B10" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="560" y="138" font-size="13" font-weight="700" fill="#F3CD7E">March — the same application</text>
  <text x="560" y="164" font-size="12" fill="#F3CD7E">New features shipped.</text>
  <text x="560" y="186" font-size="12" fill="#F3CD7E">External API integrated.</text>
  <text x="560" y="208" font-size="12" fill="#F3CD7E">Dependencies updated.</text>
  <text x="560" y="230" font-size="12" fill="#F3CD7E">Authentication logic changed.</text>
  <text x="560" y="252" font-size="12" fill="#F3CD7E">Cloud configuration modified.</text>

  <line x1="690" y1="270" x2="690" y2="262" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4"/>

  <line x1="90" y1="268" x2="830" y2="268" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="210" cy="268" r="6" fill="#E8B54D"/>
  <circle cx="690" cy="268" r="6" fill="#E8B54D"/>

  <line x1="216" y1="300" x2="684" y2="300" stroke="#E8B54D" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="450" y="292" text-anchor="middle" font-size="11.5" fill="#F3CD7E">change accumulates between assessments</text>

  <rect x="60" y="330" width="780" height="76" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>
  <text x="80" y="358" font-size="12.5" fill="#E4E4E7">The assessment remains useful as a record of what was true in January.</text>
  <text x="80" y="380" font-size="12.5" fill="#E4E4E7">It does not tell you what the security state looks like today, because the application changed.</text>
</svg>
