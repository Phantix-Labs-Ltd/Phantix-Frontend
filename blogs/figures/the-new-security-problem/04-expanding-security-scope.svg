<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">The Security Scope Has Expanded</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">We are no longer securing only the application</text>

  <line x1="240" y1="174" x2="392" y2="234" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="660" y1="174" x2="508" y2="234" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="292" y1="322" x2="336" y2="272" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="608" y1="322" x2="564" y2="272" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="450" y1="388" x2="450" y2="314" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="80" y="110" width="250" height="64" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="205" y="138" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E4E4E7">The AI model</text>
  <text x="205" y="158" text-anchor="middle" font-size="11" fill="#A1A1AA">what it was trained on</text>

  <rect x="570" y="110" width="250" height="64" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="138" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E4E4E7">The agent</text>
  <text x="695" y="158" text-anchor="middle" font-size="11" fill="#A1A1AA">what it is allowed to do</text>

  <rect x="60" y="290" width="230" height="64" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="175" y="328" text-anchor="middle" font-size="12.5" fill="#E4E4E7">The tools it can access</text>

  <rect x="610" y="290" width="230" height="64" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="725" y="328" text-anchor="middle" font-size="12.5" fill="#E4E4E7">The data it can reach</text>

  <rect x="340" y="230" width="220" height="80" rx="10" fill="#241E10" stroke="#D4A24E" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="450" y="264" text-anchor="middle" font-size="14" font-weight="700" fill="#E8B54D">The application</text>
  <text x="450" y="286" text-anchor="middle" font-size="11" fill="#E4E4E7">what we always secured</text>

  <rect x="340" y="390" width="220" height="64" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="428" text-anchor="middle" font-size="12.5" fill="#E4E4E7">The actions it can perform</text>

  <rect x="60" y="462" width="780" height="56" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>
  <text x="80" y="486" font-size="12" fill="#E4E4E7">OWASP names the risks that come with this: prompt injection, sensitive information disclosure,</text>
  <text x="80" y="506" font-size="12" fill="#E4E4E7">supply chain weaknesses, improper output handling and excessive agency.</text>
</svg>
