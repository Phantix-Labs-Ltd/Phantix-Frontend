<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">From a Finding to a Verified Finding</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">Discovery is the start. Validation and evidence are what make a finding usable</text>

  <rect x="140" y="110" width="620" height="50" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="141" text-anchor="middle" font-size="13" fill="#E4E4E7">Potential findings from automated tools</text>

  <text x="450" y="181" text-anchor="middle" font-size="12" fill="#A1A1AA">Can it be reproduced?</text>
  <rect x="88" y="162" width="96" height="28" rx="6" fill="#2A1416" stroke="#F87171" stroke-width="1"/>
  <text x="136" y="181" text-anchor="middle" font-size="11" fill="#F87171">false positive</text>
  <line x1="210" y1="164" x2="210" y2="188" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="192" width="520" height="50" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="223" text-anchor="middle" font-size="13" fill="#E8B54D">Reproduced</text>

  <text x="450" y="263" text-anchor="middle" font-size="12" fill="#A1A1AA">Is the input actually reaching a vulnerable query?</text>
  <rect x="88" y="244" width="96" height="28" rx="6" fill="#2A1416" stroke="#F87171" stroke-width="1"/>
  <text x="136" y="263" text-anchor="middle" font-size="11" fill="#F87171">not reachable</text>
  <line x1="210" y1="246" x2="210" y2="270" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="274" width="420" height="50" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="305" text-anchor="middle" font-size="13" fill="#E8B54D">Exploitable and understood</text>

  <text x="450" y="345" text-anchor="middle" font-size="12" fill="#A1A1AA">What is the potential impact?</text>
  <rect x="88" y="326" width="96" height="28" rx="6" fill="#2A1416" stroke="#F87171" stroke-width="1"/>
  <text x="136" y="345" text-anchor="middle" font-size="11" fill="#F87171">no real impact</text>
  <line x1="210" y1="328" x2="210" y2="352" stroke="#A1A1AA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="356" width="320" height="50" rx="8" fill="#0F2A20" stroke="#34D399" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="387" text-anchor="middle" font-size="13" font-weight="600" fill="#34D399">Verified finding with evidence</text>

  <rect x="60" y="430" width="780" height="56" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>
  <text x="80" y="454" font-size="12" fill="#E4E4E7">Generating thousands of findings without validation does not remove the problem, it swaps it:</text>
  <text x="80" y="474" font-size="12" fill="#E4E4E7">teams overwhelmed by alerts instead of by vulnerabilities.</text>
</svg>
