<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">The Continuous Security Feedback Loop</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">A cycle rather than a checklist, drawn in the order the work actually happens</text>

  <rect x="70" y="150" width="170" height="58" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="186" text-anchor="middle" font-size="13" fill="#E4E4E7">Develop</text>

  <line x1="242" y1="179" x2="266" y2="179" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="270" y="150" width="170" height="58" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="186" text-anchor="middle" font-size="13" fill="#E4E4E7">Test</text>

  <line x1="442" y1="179" x2="466" y2="179" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="470" y="150" width="170" height="58" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="555" y="186" text-anchor="middle" font-size="13" fill="#E4E4E7">Deploy</text>

  <line x1="642" y1="179" x2="666" y2="179" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="670" y="150" width="170" height="58" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="755" y="186" text-anchor="middle" font-size="13" fill="#E4E4E7">Monitor</text>

  <line x1="755" y1="208" x2="755" y2="256" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="670" y="260" width="170" height="58" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="2" filter="url(#shadow)"/>
  <text x="755" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#E8B54D">Detect</text>

  <line x1="668" y1="289" x2="644" y2="289" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="470" y="260" width="170" height="58" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="555" y="296" text-anchor="middle" font-size="13" fill="#E4E4E7">Validate</text>

  <line x1="468" y1="289" x2="444" y2="289" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="270" y="260" width="170" height="58" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="355" y="296" text-anchor="middle" font-size="13" fill="#E4E4E7">Fix</text>

  <line x1="268" y1="289" x2="244" y2="289" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="70" y="260" width="170" height="58" rx="8" fill="#0F2A20" stroke="#34D399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#34D399">Retest</text>

  <path d="M155 318 L155 348 L40 348 L40 179 L64 179" fill="none" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="470" y="366" text-anchor="middle" font-size="11.5" fill="#A1A1AA">the loop keeps going, release after release</text>

  <rect x="60" y="396" width="780" height="70" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>
  <text x="80" y="424" font-size="12.5" font-weight="600" fill="#E4E4E7">Continuous security does not mean running every tool every second.</text>
  <text x="80" y="446" font-size="12" fill="#A1A1AA">It means making security part of the ongoing lifecycle of the product.</text>
</svg>
