<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="900" height="520" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">How Much AI-Written Code Fails a Security Check</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">Share found to carry at least one security flaw, across the studies cited in this post</text>

  <text x="330" y="100" font-size="11.5" fill="#A1A1AA">share with at least one flaw</text>

  <line x1="330" y1="112" x2="330" y2="400" stroke="#A1A1AA" stroke-width="1.5"/>
  <line x1="330" y1="400" x2="864" y2="400" stroke="#3F3F46" stroke-width="1"/>
  <line x1="460" y1="112" x2="460" y2="400" stroke="#2A2A2E" stroke-width="1"/>
  <line x1="590" y1="112" x2="590" y2="400" stroke="#2A2A2E" stroke-width="1"/>
  <line x1="720" y1="112" x2="720" y2="400" stroke="#2A2A2E" stroke-width="1"/>
  <line x1="850" y1="112" x2="850" y2="400" stroke="#2A2A2E" stroke-width="1"/>

  <text x="330" y="420" text-anchor="middle" font-size="12" fill="#A1A1AA">0%</text>
  <text x="460" y="420" text-anchor="middle" font-size="12" fill="#A1A1AA">25%</text>
  <text x="590" y="420" text-anchor="middle" font-size="12" fill="#A1A1AA">50%</text>
  <text x="720" y="420" text-anchor="middle" font-size="12" fill="#A1A1AA">75%</text>
  <text x="850" y="420" text-anchor="middle" font-size="12" fill="#A1A1AA">100%</text>

  <text x="310" y="146" text-anchor="end" font-size="12.5" font-weight="600" fill="#E4E4E7">GitHub AI coding assistant</text>
  <text x="310" y="164" text-anchor="end" font-size="11.5" fill="#A1A1AA">early research, nearly 1,700 programs</text>
  <rect x="330" y="128" width="208" height="56" rx="6" fill="#241E10" stroke="#D4A24E" stroke-width="1.5"/>
  <text x="548" y="164" font-size="15" font-weight="700" fill="#E8B54D">40%</text>

  <text x="310" y="236" text-anchor="end" font-size="12.5" font-weight="600" fill="#E4E4E7">Later follow-up studies</text>
  <text x="310" y="254" text-anchor="end" font-size="11.5" fill="#A1A1AA">AI-written code containing a flaw</text>
  <rect x="330" y="218" width="156" height="56" rx="6" fill="#241E10" stroke="#D4A24E" stroke-width="1.5"/>
  <text x="496" y="254" font-size="15" font-weight="700" fill="#E8B54D">27% to 30%</text>

  <text x="310" y="326" text-anchor="end" font-size="12.5" font-weight="600" fill="#E4E4E7">Veracode, spring 2026</text>
  <text x="310" y="344" text-anchor="end" font-size="11.5" fill="#A1A1AA">more than 150 top models tested</text>
  <rect x="330" y="308" width="234" height="56" rx="6" fill="#241E10" stroke="#E8B54D" stroke-width="1.5"/>
  <text x="574" y="344" font-size="15" font-weight="700" fill="#F3CD7E">45%</text>

  <rect x="50" y="446" width="800" height="56" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>
  <text x="70" y="470" font-size="12" fill="#E4E4E7">In the same run, 55% of samples came out secure, so roughly 45% carried at least one OWASP Top 10 weakness.</text>
  <text x="70" y="490" font-size="12" fill="#E4E4E7">That number has barely moved between 2025 and 2026, whatever the vendors claim.</text>
</svg>
