<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">Not a Cheaper Copy, a Different Shape</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">What traditional security pricing assumes, and what small businesses can actually buy</text>

  <text x="250" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#A1A1AA">The enterprise shape</text>
  <rect x="60" y="118" width="380" height="290" rx="10" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>

  <rect x="80" y="140" width="340" height="50" rx="8" fill="#1A1A1D" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="250" y="170" text-anchor="middle" font-size="12.5" fill="#D4D4D8">Full-time security staff</text>

  <rect x="80" y="202" width="340" height="50" rx="8" fill="#1A1A1D" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="250" y="232" text-anchor="middle" font-size="12.5" fill="#D4D4D8">Constant monitoring</text>

  <rect x="80" y="264" width="340" height="50" rx="8" fill="#1A1A1D" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="250" y="294" text-anchor="middle" font-size="12.5" fill="#D4D4D8">Expensive compliance tools</text>

  <rect x="80" y="326" width="340" height="76" rx="8" fill="#1A1A1D" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="250" y="356" text-anchor="middle" font-size="12.5" fill="#D4D4D8">Priced for companies that already</text>
  <text x="250" y="376" text-anchor="middle" font-size="12.5" fill="#D4D4D8">have a security team in place</text>

  <text x="650" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#E8B54D">A different shape</text>
  <rect x="460" y="118" width="380" height="290" rx="10" fill="#151517" stroke="#2E2614" stroke-width="1"/>

  <rect x="480" y="140" width="340" height="50" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="170" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Shared infrastructure</text>

  <rect x="480" y="202" width="340" height="50" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="232" text-anchor="middle" font-size="12.5" fill="#E4E4E7">AI doing the automatic first pass</text>

  <rect x="480" y="264" width="340" height="50" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="294" text-anchor="middle" font-size="12.5" fill="#E4E4E7">Human experts for the hard problems</text>

  <rect x="480" y="326" width="340" height="76" rx="8" fill="#0F2A20" stroke="#34D399" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="650" y="356" text-anchor="middle" font-size="12.5" font-weight="600" fill="#34D399">Priced in tens of dollars a month,</text>
  <text x="650" y="376" text-anchor="middle" font-size="12.5" font-weight="600" fill="#34D399">not thousands</text>

  <rect x="60" y="428" width="780" height="38" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>
  <text x="450" y="453" text-anchor="middle" font-size="12.5" fill="#E4E4E7">The promising answers in the region are genuinely different setups, not smaller versions of enterprise tools.</text>
</svg>
