<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">The Setup Around the Model Is the Target</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">Content the agent reads becomes instructions it follows, and the tools it holds decide the damage</text>

  <rect x="250" y="100" width="400" height="68" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="276" cy="134" r="12" fill="#E8B54D"/>
  <text x="276" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#0A0A0A">1</text>
  <text x="300" y="130" font-size="13.5" font-weight="600" fill="#E4E4E7">Malicious content arrives</text>
  <text x="300" y="150" font-size="11.5" fill="#A1A1AA">inside something the agent is asked to read</text>

  <line x1="450" y1="168" x2="450" y2="192" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="250" y="196" width="400" height="68" rx="8" fill="#1F1B10" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="276" cy="230" r="12" fill="#F3CD7E"/>
  <text x="276" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#0A0A0A">2</text>
  <text x="300" y="226" font-size="13.5" font-weight="600" fill="#F3CD7E">Hidden instructions sit inside it</text>
  <text x="300" y="246" font-size="11.5" fill="#F3CD7E">the line between text and commands blurs</text>

  <line x1="450" y1="264" x2="450" y2="288" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="250" y="292" width="400" height="68" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="276" cy="326" r="12" fill="#E8B54D"/>
  <text x="276" y="331" text-anchor="middle" font-size="12" font-weight="700" fill="#0A0A0A">3</text>
  <text x="300" y="322" font-size="13.5" font-weight="600" fill="#E8B54D">The agent treats them as the task</text>
  <text x="300" y="342" font-size="11.5" fill="#E4E4E7">this trick is prompt injection</text>

  <line x1="450" y1="360" x2="255" y2="392" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="450" y1="360" x2="645" y2="392" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="60" y="396" width="370" height="64" rx="8" fill="#2A1416" stroke="#F87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="245" y="434" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F87171">Harmful commands run</text>

  <rect x="470" y="396" width="370" height="64" rx="8" fill="#2A1416" stroke="#F87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="655" y="434" text-anchor="middle" font-size="13.5" font-weight="600" fill="#F87171">Company data leaves quietly</text>

  <rect x="60" y="486" width="780" height="56" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>
  <text x="80" y="510" font-size="12" fill="#E4E4E7">A hidden description inside a pull request was enough to make a coding assistant run harmful commands.</text>
  <text x="80" y="530" font-size="12" fill="#E4E4E7">A hidden instruction inside a document leaked company data with no user clicking anything.</text>
</svg>
