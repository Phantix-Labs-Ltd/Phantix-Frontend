<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>

  <rect width="900" height="430" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">The Trust Problem in One Picture</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#A1A1AA">The tool does not just add mistakes. It also makes people less likely to notice them.</text>

  <text x="60" y="104" font-size="13" font-weight="700" fill="#E8B54D">How a flaw survives</text>

  <rect x="60" y="120" width="360" height="64" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="158" text-anchor="middle" font-size="13" fill="#E4E4E7">AI help writes the code</text>

  <line x1="240" y1="184" x2="240" y2="204" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="60" y="208" width="360" height="64" rx="8" fill="#1F1B10" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="246" text-anchor="middle" font-size="13" fill="#F3CD7E">The developer trusts it more, not less</text>

  <line x1="240" y1="272" x2="240" y2="292" stroke="#A1A1AA" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="60" y="296" width="360" height="64" rx="8" fill="#2A1416" stroke="#F87171" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="334" text-anchor="middle" font-size="13" fill="#F87171">The flaw is more likely to reach production</text>

  <rect x="490" y="120" width="360" height="240" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1" filter="url(#shadow)"/>
  <text x="510" y="150" font-size="14" font-weight="700" fill="#E4E4E7">What the study found</text>

  <circle cx="514" cy="180" r="3.5" fill="#D4A24E"/>
  <text x="528" y="184" font-size="12.5" fill="#E4E4E7">Developers using AI help wrote code</text>
  <text x="528" y="200" font-size="12.5" fill="#E4E4E7">that was actually less secure.</text>

  <circle cx="514" cy="228" r="3.5" fill="#D4A24E"/>
  <text x="528" y="232" font-size="12.5" fill="#E4E4E7">They were also more likely to believe</text>
  <text x="528" y="248" font-size="12.5" fill="#E4E4E7">their own flawed code was safe.</text>

  <circle cx="514" cy="276" r="3.5" fill="#D4A24E"/>
  <text x="528" y="280" font-size="12.5" fill="#E4E4E7">Measured against developers who did</text>
  <text x="528" y="296" font-size="12.5" fill="#E4E4E7">not use AI help at all.</text>

  <text x="510" y="336" font-size="11.5" fill="#A1A1AA">One study, comparing two groups on the same task.</text>

  <rect x="60" y="382" width="790" height="36" rx="8" fill="#151517" stroke="#2A2A2E" stroke-width="1"/>
  <text x="455" y="406" text-anchor="middle" font-size="12.5" fill="#E4E4E7">The instinct that something feels wrong about letting AI grade its own homework turns out to be measurable.</text>
</svg>
