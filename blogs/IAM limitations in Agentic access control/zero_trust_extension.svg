<svg style="background:#0A0A0A" viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
  </defs>
  <rect width="900" height="760" fill="#0A0A0A"/>

  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">Extending Zero Trust for Autonomous Agents</text>
  <text x="450" y="62" text-anchor="middle" font-size="12.5" fill="#A1A1AA">Conventional PEP/PDP model (left) vs. the proposed Agent Policy Decision Point (right)</text>

  <!-- Left column: conventional Zero Trust -->
  <text x="185" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#C9A227">Conventional Zero Trust</text>

  <g font-size="13.5">
    <rect x="90" y="120" width="190" height="46" rx="8" fill="#151517" stroke="#C9A227" stroke-width="1.6"/>
    <text x="185" y="148" text-anchor="middle" fill="#F4F4F5">Subject</text>

    <line x1="185" y1="166" x2="185" y2="200" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="90" y="200" width="190" height="46" rx="8" fill="#151517" stroke="#C9A227" stroke-width="1.6"/>
    <text x="185" y="228" text-anchor="middle" fill="#F4F4F5">Policy Enforcement Point</text>

    <line x1="185" y1="246" x2="185" y2="280" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="90" y="280" width="190" height="46" rx="8" fill="#151517" stroke="#C9A227" stroke-width="1.6"/>
    <text x="185" y="308" text-anchor="middle" fill="#F4F4F5">Policy Decision Point</text>

    <line x1="185" y1="326" x2="185" y2="360" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="90" y="360" width="190" height="46" rx="8" fill="#1A1A1D" stroke="#C9A227" stroke-width="1.6"/>
    <text x="185" y="388" text-anchor="middle" fill="#F4F4F5">Resource</text>
  </g>

  <!-- divider -->
  <line x1="410" y1="90" x2="410" y2="720" stroke="#2A2A2E" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Right column: extended model -->
  <text x="655" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#C9A227">Proposed Extension for Agents</text>

  <g font-size="13">
    <rect x="545" y="118" width="220" height="42" rx="8" fill="#151517" stroke="#C9A227" stroke-width="1.6"/>
    <text x="655" y="144" text-anchor="middle" fill="#F4F4F5">Agent Run</text>

    <line x1="655" y1="160" x2="655" y2="190" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="545" y="190" width="220" height="42" rx="8" fill="#151517" stroke="#C9A227" stroke-width="1.6"/>
    <text x="655" y="216" text-anchor="middle" fill="#F4F4F5">Action Request</text>

    <line x1="655" y1="232" x2="655" y2="262" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

    <!-- PDP box with sub-considerations -->
    <rect x="500" y="262" width="310" height="200" rx="10" fill="#1F1B10" stroke="#C9A227" stroke-width="1.8"/>
    <text x="655" y="286" text-anchor="middle" font-weight="700" fill="#F4F4F5">Agent Policy Decision Point</text>
    <g font-size="12.5" fill="#D4D4D8">
      <text x="530" y="310">&#8226; Identity</text>
      <text x="530" y="331">&#8226; Delegation</text>
      <text x="530" y="352">&#8226; Objective</text>
      <text x="530" y="373">&#8226; Context provenance</text>
      <text x="530" y="394">&#8226; Risk</text>
      <text x="530" y="415">&#8226; Sequence history</text>
      <text x="530" y="436">&#8226; Approval state</text>
    </g>

    <line x1="655" y1="462" x2="655" y2="492" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="545" y="492" width="220" height="42" rx="8" fill="#151517" stroke="#C9A227" stroke-width="1.6"/>
    <text x="655" y="518" text-anchor="middle" fill="#F4F4F5">Capability Broker</text>

    <line x1="655" y1="534" x2="655" y2="564" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="545" y="564" width="220" height="42" rx="8" fill="#151517" stroke="#C9A227" stroke-width="1.6"/>
    <text x="655" y="590" text-anchor="middle" fill="#F4F4F5">Policy Enforcement Gateway</text>

    <line x1="655" y1="606" x2="655" y2="636" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="545" y="636" width="220" height="42" rx="8" fill="#1A1A1D" stroke="#C9A227" stroke-width="1.6"/>
    <text x="655" y="662" text-anchor="middle" fill="#F4F4F5">MCP / API / Resource</text>
  </g>

  <text x="450" y="742" text-anchor="middle" font-size="12" fill="#A1A1AA" font-style="italic">The contribution is not a replacement for Zero Trust — it redefines the subject as an Agent Run acting under delegation, for an objective, within bounded context.</text>
</svg>
