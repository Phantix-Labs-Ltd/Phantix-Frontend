<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="380" height="480" viewBox="0 0 380 480">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <text x="190" y="28" text-anchor="middle" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E4E4E7">Agentic Delegation Chain</text>
  
  <g font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="13">
    <!-- Org -->
    <rect x="70" y="45" width="240" height="42" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="2" filter="url(#shadow)"/>
    <text x="190" y="71" text-anchor="middle" font-weight="600" fill="#E8B54D">Organization</text>
    <line x1="190" y1="87" x2="190" y2="105" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="190,112 184,102 196,102" fill="#A1A1AA"/>
    
    <!-- Human -->
    <rect x="70" y="112" width="240" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="190" y="138" text-anchor="middle" fill="#E4E4E7">Security Administrator</text>
    <line x1="190" y1="154" x2="190" y2="172" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="190,179 184,169 196,169" fill="#A1A1AA"/>
    
    <!-- SOC -->
    <rect x="70" y="179" width="240" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="190" y="205" text-anchor="middle" fill="#E4E4E7">SOC Agent</text>
    <line x1="190" y1="221" x2="190" y2="239" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="190,246 184,236 196,236" fill="#A1A1AA"/>
    
    <!-- IR Run -->
    <rect x="70" y="246" width="240" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="190" y="272" text-anchor="middle" fill="#E4E4E7">Incident Response Run</text>
    <line x1="190" y1="288" x2="190" y2="306" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="190,313 184,303 196,303" fill="#A1A1AA"/>
    
    <!-- Sub -->
    <rect x="70" y="313" width="240" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="190" y="339" text-anchor="middle" fill="#E4E4E7">Incident Response Sub-Agent</text>
    <line x1="190" y1="355" x2="190" y2="373" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="190,380 184,370 196,370" fill="#A1A1AA"/>
    
    <!-- Tool -->
    <rect x="70" y="380" width="240" height="42" rx="8" fill="#241E10" stroke="#E8B54D" stroke-width="2" filter="url(#shadow)"/>
    <text x="190" y="406" text-anchor="middle" font-weight="600" fill="#F3CD7E">MCP Tool</text>
  </g>
  
  <text x="190" y="455" text-anchor="middle" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="11" fill="#A1A1AA">Authority attenuates at each transition</text>
</svg>
