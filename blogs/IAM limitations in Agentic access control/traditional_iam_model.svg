<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="210" y="28" text-anchor="middle" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E4E4E7">Traditional IAM Model</text>

  <g font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="13">

    <!-- Principal -->
    <rect x="95" y="50" width="230" height="44" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="2" filter="url(#shadow)"/>
    <text x="210" y="77" text-anchor="middle" font-weight="600" fill="#E8B54D">Principal</text>

    <!-- Arrow down + label -->
    <line x1="210" y1="94" x2="210" y2="118" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,126 204,116 216,116" fill="#A1A1AA"/>
    <text x="250" y="112" font-size="11" fill="#A1A1AA">Authenticate</text>

    <!-- Identity Provider -->
    <rect x="95" y="130" width="230" height="44" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="157" text-anchor="middle" fill="#E4E4E7">Identity Provider</text>

    <!-- Arrow down + label -->
    <line x1="210" y1="174" x2="210" y2="198" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,206 204,196 216,196" fill="#A1A1AA"/>
    <text x="265" y="192" font-size="11" fill="#A1A1AA">Token / Credential</text>

    <!-- Authorization System -->
    <rect x="95" y="210" width="230" height="44" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="237" text-anchor="middle" fill="#E4E4E7">Authorization System</text>

    <!-- Vertical stem -->
    <line x1="210" y1="254" x2="210" y2="300" stroke="#A1A1AA" stroke-width="2"/>

    <!-- Branch left (Permit) -->
    <line x1="210" y1="300" x2="120" y2="300" stroke="#A1A1AA" stroke-width="2"/>
    <line x1="120" y1="300" x2="120" y2="330" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="120,338 114,328 126,328" fill="#34D399"/>

    <!-- Branch right (Deny) -->
    <line x1="210" y1="300" x2="300" y2="300" stroke="#A1A1AA" stroke-width="2"/>
    <line x1="300" y1="300" x2="300" y2="330" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="300,338 294,328 306,328" fill="#F87171"/>

    <!-- Permit box -->
    <rect x="40" y="342" width="160" height="42" rx="8" fill="#0F2A20" stroke="#34D399" stroke-width="2" filter="url(#shadow)"/>
    <text x="120" y="368" text-anchor="middle" font-weight="600" fill="#34D399">Permit</text>

    <!-- Deny box -->
    <rect x="220" y="342" width="160" height="42" rx="8" fill="#2A1416" stroke="#F87171" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="368" text-anchor="middle" font-weight="600" fill="#F87171">Deny</text>

  </g>
</svg>
