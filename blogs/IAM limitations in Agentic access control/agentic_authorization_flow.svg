<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="420" height="680" viewBox="0 0 420 680">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <text x="210" y="28" text-anchor="middle" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E4E4E7">Agentic Authorization Problem — Dynamic Path</text>
  
  <g font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="13">
    <rect x="85" y="45" width="250" height="42" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="2" filter="url(#shadow)"/>
    <text x="210" y="71" text-anchor="middle" font-weight="600" fill="#E8B54D">Receive Objective</text>
    <line x1="210" y1="87" x2="210" y2="105" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,112 204,102 216,102" fill="#A1A1AA"/>
    
    <rect x="85" y="112" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="138" text-anchor="middle" fill="#E4E4E7">Acquire Context</text>
    <line x1="210" y1="154" x2="210" y2="172" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,179 204,169 216,169" fill="#A1A1AA"/>
    
    <rect x="85" y="179" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="205" text-anchor="middle" fill="#E4E4E7">Interpret Information</text>
    <line x1="210" y1="221" x2="210" y2="239" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,246 204,236 216,236" fill="#A1A1AA"/>
    
    <rect x="85" y="246" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="272" text-anchor="middle" fill="#E4E4E7">Select Tools</text>
    <line x1="210" y1="288" x2="210" y2="306" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,313 204,303 216,303" fill="#A1A1AA"/>
    
    <rect x="85" y="313" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="339" text-anchor="middle" fill="#E4E4E7">Generate Parameters</text>
    <line x1="210" y1="355" x2="210" y2="373" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,380 204,370 216,370" fill="#A1A1AA"/>
    
    <rect x="85" y="380" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="406" text-anchor="middle" fill="#E4E4E7">Execute Action</text>
    <line x1="210" y1="422" x2="210" y2="440" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,447 204,437 216,437" fill="#A1A1AA"/>
    
    <rect x="85" y="447" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="473" text-anchor="middle" fill="#E4E4E7">Observe Results</text>
    <line x1="210" y1="489" x2="210" y2="507" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,514 204,504 216,504" fill="#A1A1AA"/>
    
    <rect x="85" y="514" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="210" y="540" text-anchor="middle" fill="#E4E4E7">Modify Plan</text>
    <line x1="210" y1="556" x2="210" y2="574" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="210,581 204,571 216,571" fill="#A1A1AA"/>
    
    <rect x="85" y="581" width="250" height="42" rx="8" fill="#241E10" stroke="#E8B54D" stroke-width="2" filter="url(#shadow)"/>
    <text x="210" y="607" text-anchor="middle" font-weight="600" fill="#F3CD7E">Execute Additional Actions</text>
