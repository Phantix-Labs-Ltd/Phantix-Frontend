<svg style="background:#0A0A0A" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A1A1AA"/>
    </marker>
    <linearGradient id="attenuate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
  </defs>
  <rect width="900" height="640" fill="#0A0A0A"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#F4F4F5">Delegation and Authority Attenuation</text>
  <text x="450" y="60" text-anchor="middle" font-size="12.5" fill="#A1A1AA">Authority narrows as it moves down the hierarchy — a child never inherits full parent authority</text>

  <!-- attenuation bar on the left -->
  <rect x="40" y="90" width="14" height="480" rx="7" fill="url(#attenuate)"/>
  <text x="47" y="82" text-anchor="middle" font-size="11" fill="#C9A227" font-weight="700">Broad</text>
  <text x="47" y="588" text-anchor="middle" font-size="11" fill="#F87171" font-weight="700">Narrow</text>

  <g font-size="14">
    <rect x="330" y="90" width="240" height="50" rx="9" fill="#151517" stroke="#C9A227" stroke-width="1.8"/>
    <text x="450" y="120" text-anchor="middle" fill="#F4F4F5" font-weight="700">Human / Organization</text>

    <line x1="450" y1="140" x2="450" y2="172" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arr3)"/>

    <rect x="330" y="172" width="240" height="50" rx="9" fill="#151517" stroke="#C9A227" stroke-width="1.8"/>
    <text x="450" y="202" text-anchor="middle" fill="#F4F4F5" font-weight="700">Orchestrator Agent</text>

    <line x1="450" y1="222" x2="330" y2="256" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arr3)"/>
    <line x1="450" y1="222" x2="570" y2="256" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arr3)"/>

    <rect x="210" y="256" width="220" height="50" rx="9" fill="#151517" stroke="#A1A1AA" stroke-width="1.8"/>
    <text x="320" y="286" text-anchor="middle" fill="#F4F4F5" font-weight="700">SOC Agent</text>

    <rect x="470" y="256" width="220" height="50" rx="9" fill="#151517" stroke="#A1A1AA" stroke-width="1.8"/>
    <text x="580" y="286" text-anchor="middle" fill="#F4F4F5" font-weight="700">GRC Agent</text>

    <line x1="320" y1="306" x2="320" y2="340" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arr3)"/>

    <rect x="210" y="340" width="220" height="50" rx="9" fill="#151517" stroke="#C9A227" stroke-width="1.8"/>
    <text x="320" y="370" text-anchor="middle" fill="#F4F4F5" font-weight="700">Incident Response Sub-Agent</text>

    <line x1="320" y1="390" x2="320" y2="424" stroke="#A1A1AA" stroke-width="1.6" marker-end="url(#arr3)"/>

    <rect x="210" y="424" width="220" height="50" rx="9" fill="#151517" stroke="#F87171" stroke-width="1.8"/>
    <text x="320" y="454" text-anchor="middle" fill="#F4F4F5" font-weight="700">MCP Tool</text>
  </g>

  <!-- side annotations of the three rules -->
  <g font-size="12.5">
    <rect x="630" y="340" width="230" height="160" rx="10" fill="#151517" stroke="#2A2A2E" stroke-width="1.4"/>
    <text x="645" y="364" font-weight="700" fill="#F4F4F5" font-size="13">Three attenuation rules</text>
    <text x="645" y="392" fill="#D4D4D8">1. No implicit transitive</text>
    <text x="645" y="408" fill="#D4D4D8">   authority</text>
    <text x="645" y="432" fill="#D4D4D8">2. Authority(child) &#8838;</text>
    <text x="645" y="448" fill="#D4D4D8">   Authority(parent)</text>
    <text x="645" y="472" fill="#D4D4D8">3. Escalation requires</text>
    <text x="645" y="488" fill="#D4D4D8">   independent authorization</text>
  </g>

  <text x="450" y="600" text-anchor="middle" font-size="12" fill="#A1A1AA" font-style="italic">Each transition in the chain must answer: how much authority is transferred, and under what constraints?</text>
</svg>
