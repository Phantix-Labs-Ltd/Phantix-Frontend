<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <text x="240" y="28" text-anchor="middle" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E4E4E7">Authorized Agency Model</text>
  
  <g font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="13">
    <rect x="90" y="45" width="300" height="42" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="2" filter="url(#shadow)"/>
    <text x="240" y="71" text-anchor="middle" font-weight="600" fill="#E8B54D">Who are you?</text>
    <line x1="240" y1="87" x2="240" y2="105" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="240,112 234,102 246,102" fill="#A1A1AA"/>
    
    <rect x="90" y="112" width="300" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="240" y="138" text-anchor="middle" fill="#E4E4E7">Who authorized you?</text>
    <line x1="240" y1="154" x2="240" y2="172" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="240,179 234,169 246,169" fill="#A1A1AA"/>
    
    <rect x="90" y="179" width="300" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="240" y="205" text-anchor="middle" fill="#E4E4E7">For what objective?</text>
    <line x1="240" y1="221" x2="240" y2="239" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="240,246 234,236 246,236" fill="#A1A1AA"/>
    
    <rect x="90" y="246" width="300" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="240" y="272" text-anchor="middle" fill="#E4E4E7">What context influenced this action?</text>
    <line x1="240" y1="288" x2="240" y2="306" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="240,313 234,303 246,303" fill="#A1A1AA"/>
    
    <rect x="90" y="313" width="300" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="240" y="339" text-anchor="middle" fill="#E4E4E7">What capability is required?</text>
    <line x1="240" y1="355" x2="240" y2="373" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="240,380 234,370 246,370" fill="#A1A1AA"/>
    
    <rect x="90" y="380" width="300" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="240" y="406" text-anchor="middle" fill="#E4E4E7">Under what conditions?</text>
    <line x1="240" y1="422" x2="240" y2="440" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="240,447 234,437 246,437" fill="#A1A1AA"/>
    
    <rect x="90" y="447" width="300" height="42" rx="8" fill="#0F2A20" stroke="#34D399" stroke-width="2" filter="url(#shadow)"/>
    <text x="240" y="473" text-anchor="middle" font-weight="600" fill="#34D399">Is this action still authorized now?</text>
  </g>
</svg>
