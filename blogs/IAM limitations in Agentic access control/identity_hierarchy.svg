<svg style="background:#0A0A0A" xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A2A2E;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#A1A1AA" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <text x="200" y="28" text-anchor="middle" font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E4E4E7">Identity Hierarchy in Agentic Systems</text>
  
  <g font-family="Geist Variable, Space Grotesk, Inter, system-ui, sans-serif" font-size="13">
    <rect x="75" y="45" width="250" height="42" rx="8" fill="#241E10" stroke="#D4A24E" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="71" text-anchor="middle" font-weight="600" fill="#E8B54D">Organization Identity</text>
    <line x1="200" y1="87" x2="200" y2="105" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="200,112 194,102 206,102" fill="#A1A1AA"/>
    
    <rect x="75" y="112" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="138" text-anchor="middle" fill="#E4E4E7">Human or System Principal</text>
    <line x1="200" y1="154" x2="200" y2="172" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="200,179 194,169 206,169" fill="#A1A1AA"/>
    
    <rect x="75" y="179" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="205" text-anchor="middle" fill="#E4E4E7">Agent Identity</text>
    <line x1="200" y1="221" x2="200" y2="239" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="200,246 194,236 206,236" fill="#A1A1AA"/>
    
    <rect x="75" y="246" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="272" text-anchor="middle" fill="#E4E4E7">Agent Version / Configuration</text>
    <line x1="200" y1="288" x2="200" y2="306" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="200,313 194,303 206,303" fill="#A1A1AA"/>
    
    <rect x="75" y="313" width="250" height="42" rx="8" fill="#241E10" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="339" text-anchor="middle" fill="#F3CD7E">Agent Run Identity</text>
    <line x1="200" y1="355" x2="200" y2="373" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="200,380 194,370 206,370" fill="#A1A1AA"/>
    
    <rect x="75" y="380" width="250" height="42" rx="8" fill="url(#boxGrad)" stroke="#E8B54D" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="406" text-anchor="middle" fill="#E4E4E7">Sub-Agent Identity</text>
    <line x1="200" y1="422" x2="200" y2="440" stroke="#A1A1AA" stroke-width="2"/>
    <polygon points="200,447 194,437 206,437" fill="#A1A1AA"/>
    
    <rect x="75" y="447" width="250" height="42" rx="8" fill="#2A1420" stroke="#F472B6" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="200" y="473" text-anchor="middle" fill="#F472B6">Tool or Workload Identity</text>
  </g>
</svg>
